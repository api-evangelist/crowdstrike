  current: mixed
  distribution:
    v1: 1271
    v2: 154
    v3: 32
    v4: 1
    unversioned: 5
  docs: https://developer.crowdstrike.com/api-reference/all-operations/
  note: A single collection commonly exposes v1, v2 and v3 of the same operation simultaneously; the v1 is usually
    the deprecated one.
deprecation:
  policy_url: null
  sunset_header: false
  signal: operation summary text
  pattern:
  - '''Deprecated: please use version vN of this endpoint.'''
  - '''Deprecated : Please use <METHOD> <path>.'''
  - '''Deprecated: This endpoint will be decommissioned on <date>.'''
  deprecated_operation_count: 33
  dated_decommissions:
  - date: '2025-09-30'
    operations:
    - GetAggregateDetects
    - GetDetectSummaries
    - QueryDetects
    - UpdateDetectsByIdsV2
    note: The four legacy Detects operations name a decommission date that has already passed; they are still listed
      in the reference as of 2026-09-19.
  note: No published deprecation POLICY (notice period, support window) was found on any public CrowdStrike surface
    — only per-operation notices.
