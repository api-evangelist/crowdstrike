description: CrowdStrike versions each operation independently in the URI path (/v1 … /v4) rather than versioning
  the platform API as a whole, and signals retirement in the operation summary itself. 33 of 1,463 documented operations
  carry a Deprecated notice, most naming the replacement operation; a handful name a decommission DATE. No separate
  deprecation-policy page, no Sunset/Deprecation response headers are documented, and no public status page was
  found.
versioning:
