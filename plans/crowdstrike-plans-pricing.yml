description: CrowdStrike Falcon is per-device subscription pricing. Three self-serve bundles carry published list
  prices (Go, Pro, Enterprise), monthly or annual; Falcon Elite and Falcon Complete MDR are contact-sales. A 15-day
  free trial requires no credit card and covers Falcon Prevent, Device Control and Express Support. Falcon Go is
  capped at 100 devices. Prices re-verified against the live pricing page on 2026-09-19 and unchanged from the 2026-05
  capture; the method was upgraded from generated to searched because each figure was read from the page.
sources:
- https://www.crowdstrike.com/en-us/pricing/
