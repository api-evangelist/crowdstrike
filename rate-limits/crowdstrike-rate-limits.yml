specification: API Commons Rate Limits
specificationVersion: '0.1'
schema: https://raw.githubusercontent.com/api-evangelist/interface-research/main/schema/api-commons.yml#/$defs/RateLimits
provider: CrowdStrike
providerId: crowdstrike
created: '2026-05-04'
# Provenance stamped 2026-08-11: this artifact was written by the API Evangelist
# bulk sweep dated 2026-05-04, not harvested from the provider. See roadmap#35.
method: generated
modified: '2026-05-05'
reconciled: false
tags:
  - Cybersecurity
  - Endpoint Security
  - Rate Limiting
  - Quotas
  - Throttling
description: CrowdStrike Falcon OAuth2 APIs are rate-limited per-client and per-endpoint. Specific numeric
  limits are not published publicly; they vary by API surface (Detects, Hosts, Real-Time Response, Spotlight,
  etc.) and are documented in the authenticated Falcon developer portal. Throttling is signaled with HTTP
  429 plus rate-limit headers; clients are expected to honor Retry-After.
sources:
  - https://www.crowdstrike.com/en-us/pricing/
  - https://falcon.crowdstrike.com/documentation/page/a2a7fc0e/crowdstrike-oauth2-based-apis
notes: Specific per-second and per-minute numbers are gated behind the Falcon console login. Treat the
  limits below as descriptive and reconcile against your tenant's documented values.
headers:
  limit: X-RateLimit-Limit
  remaining: X-RateLimit-Remaining
  retryAfter: X-Ratelimit-Retryafter
responseCodes:
  throttled: 429
  quotaExceeded: 429
  serviceUnavailable: 503
limits:
  - name: Per-API rate limit
    scope: api-client
    metric: varies
    limit: see CrowdStrike Falcon documentation per API surface
    applies:
      - CrowdStrike API
  - name: Per-endpoint concurrency
    scope: api-client
    metric: concurrent_requests
    limit: see CrowdStrike Falcon documentation per API surface
    applies:
      - CrowdStrike API
policies:
  - name: OAuth2 token refresh
    description: Tokens are issued via OAuth2 client credentials and expire after 30 minutes; cache and
      reuse tokens until expiry rather than minting per-request.
  - name: Backoff Strategy
    description: On HTTP 429, honor X-Ratelimit-Retryafter (epoch seconds) and apply exponential backoff
      with jitter for retried calls.
  - name: Per-API surface limits
    description: Limits are scoped per API (Detects, Hosts, RTR, Spotlight, IOC, etc.) rather than globally;
      a 429 on one surface does not throttle others.
  - name: Pagination over polling
    description: Use offset/limit or after/before pagination on listing endpoints rather than tight polling
      loops to stay within rate caps.
maintainers:
