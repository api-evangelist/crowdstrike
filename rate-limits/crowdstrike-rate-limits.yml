specification: API Commons Rate Limits
specificationVersion: '0.1'
schema: https://raw.githubusercontent.com/api-evangelist/interface-research/main/schema/api-commons.yml#/$defs/RateLimits
provider: CrowdStrike
providerId: crowdstrike
created: '2026-05-04'
method: probed
modified: '2026-05-05'
reconciled: true
tags:
- Cybersecurity
- Endpoint Security
- Rate Limiting
- Quotas
- Throttling
description: 'CrowdStrike Falcon signals rate limiting on every response with X-Ratelimit-Limit and X-Ratelimit-Remaining,
  and returns HTTP 429 on exhaustion — 429 is a documented response on operations across the reference including
  POST /oauth2/token. The numeric ceiling is NOT published in prose anywhere on the public developer surface, but
  it is observable: an unauthenticated caller is served X-Ratelimit-Limit: 300 with a decrementing X-Ratelimit-Remaining
  on api.crowdstrike.com. Per-tenant and per-collection ceilings are stated only inside the authenticated Falcon
  console.'
sources:
- https://developer.crowdstrike.com/api-reference/collections/oauth2/
- https://developer.crowdstrike.com/sdks/python/responses/
notes: Numeric per-collection ceilings remain gated behind the Falcon console login; the 300 above is what the public
  edge actually returns and is recorded as observed, not as a documented contract.
headers:
  limit: X-Ratelimit-Limit
  remaining: X-Ratelimit-Remaining
  region: X-Cs-Region
  trace: X-Cs-Traceid
  retryAfter: null
  note: Retry-After was NOT observed and is not documented. An earlier version of this artifact asserted an 'X-Ratelimit-Retryafter'
    header; no such header appeared on any probed response and no CrowdStrike documentation names it, so it is removed
    rather than carried forward.
responseCodes:
  throttled: 429
  quotaExceeded: 429
  serviceUnavailable: 503
limits:
- name: Observed default ceiling (unauthenticated edge)
  scope: api-client
  metric: requests
  limit: 300
  window: unstated
  burst: null
  evidence:
    url: https://api.crowdstrike.com/oauth2/token
    method: POST
    status: 401
    headers:
      X-Ratelimit-Limit: '300'
      X-Ratelimit-Remaining: '299'
    observed: '2026-09-19'
  note: The header names a limit of 300 and a decrementing remainder; the WINDOW is not stated in the header or
    the docs.
  applies:
  - CrowdStrike API
- name: Per-service-collection limits
  scope: api-client
  metric: varies
  limit: null
  note: Limits are scoped per service collection (Detects, Hosts, RTR, Spotlight, IOC …) and their numbers are published
    only inside the authenticated Falcon console. Not guessed here.
  applies:
  - CrowdStrike API
policies:
- name: OAuth2 token reuse
  description: Tokens are issued by POST /oauth2/token and expire after 30 minutes; cache and reuse until expiry
    rather than minting per request.
- name: Backoff on 429
  description: No Retry-After is returned, so exponential backoff with jitter is the only available strategy; read
    X-Ratelimit-Remaining to back off before exhaustion.
- name: Pagination over polling
  description: Use offset/limit (meta.pagination.total) on listing endpoints rather than tight polling loops.
- name: Stream instead of poll
  description: For continuous change, subscribe to the Event Streams datafeed rather than repeatedly querying —
    see asyncapi/crowdstrike-event-streams.yml.
maintainers:
