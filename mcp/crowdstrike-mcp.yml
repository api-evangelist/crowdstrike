specification: API Commons MCP Server
specificationVersion: '0.1'
provider: CrowdStrike
providerId: crowdstrike
generated: '2026-09-19'
method: searched
status: published
source: https://developer.crowdstrike.com/falcon-mcp/overview/
description: 'CrowdStrike publishes falcon-mcp, a first-party open-source MCP server that connects agents to the
  Falcon platform. It is a LOCAL STDIO product: installed with uv/pip/uvx and run by the operator, authenticating
  with the operator''s own Falcon OAuth2 client credentials. CrowdStrike also operates a separate HOSTED Falcon
  MCP (discovery-shaped: search_tools then execute_tool) which its own docs compare against this one, but publishes
  no anonymous endpoint URL for it — so no remote endpoint is recorded here.'
deployment:
  mode: local-stdio
  install: uvx falcon-mcp
  package: https://pypi.org/project/falcon-mcp/
  auth: api-key
  verified: searched
  notes:
  - 'Installs documented verbatim: `uv tool install falcon-mcp`, `pip install falcon-mcp`, `uvx falcon-mcp` (recommended
    for editor integrations).'
  - Auth is a Falcon OAuth2 API client (FALCON_CLIENT_ID / FALCON_CLIENT_SECRET) created in the Falcon console —
    an operator-held credential, not a delegated OAuth flow.
  - The server can also be started with sse or streamable-http transport on a host/port the OPERATOR chooses (FALCON_MCP_TRANSPORT);
    that is still self-hosted, not a CrowdStrike-operated endpoint.
  - A CrowdStrike-hosted Falcon MCP exists and is documented by contrast in /falcon-mcp/modules/overview/, but no
    public endpoint URL is published, so `mode` stays local-stdio rather than `both`.
  - Deployment guides exist for Docker, Amazon Bedrock AgentCore and Google Cloud Run / Vertex AI Agent Engine —
    all operator-run.
server:
  name: io.github.CrowdStrike/falcon-mcp
  title: CrowdStrike Falcon MCP Server
  version: 0.19.0
  transport:
  - stdio
  - sse
  - streamable-http
  repository: https://github.com/CrowdStrike/falcon-mcp
  registry_manifest: https://raw.githubusercontent.com/CrowdStrike/falcon-mcp/main/server.json
  registries:
  - https://registry.modelcontextprotocol.io/?q=io.github.CrowdStrike%2Ffalcon-mcp&all=1
  - https://github.com/mcp/CrowdStrike/falcon-mcp
  - https://geminicli.com/extensions/?name=CrowdStrikefalcon-mcp
  docs: https://developer.crowdstrike.com/falcon-mcp/overview/
  changelog: https://developer.crowdstrike.com/falcon-mcp/changelog/
modes:
  default: every enabled module's falcon_* tool is registered up front
  dynamic: FALCON_MCP tool surface collapses to falcon_search_tools, falcon_execute_tool and falcon_list_enabled_tools
  filters:
  - --read-only
  - --tools
  - --exclude-tools
tool_count: 166
module_count: 28
