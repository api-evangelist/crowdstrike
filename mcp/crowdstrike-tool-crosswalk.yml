specification: API Commons Tool Crosswalk
specificationVersion: '0.1'
provider: CrowdStrike
providerId: crowdstrike
generated: '2026-09-19'
method: derived
source: mcp/crowdstrike-mcp.yml + https://developer.crowdstrike.com/api-reference/all-operations/ (via /llms-full.txt)
description: 'Binds the 166 documented falcon-mcp tools to the CrowdStrike Falcon REST operations that back them.
  CrowdStrike publishes NO OpenAPI document, so the REST side of this crosswalk is the provider''s own documented
  operation registry (operationId + method + path + required scope for 1,463 operations, harvested from developer.crowdstrike.com/llms-full.txt),
  not a spec file. Bindings are scope-constrained: an operation is only considered for a tool when it carries one
  of the scopes that tool''s module documents as required. Because both the live tools/list schema and the underlying
  swagger are gated, no binding here is schema-verified — confidence is recorded honestly and the unbound tools
  are listed rather than guessed at.'
surfaces:
  openapi:
    present: false
    note: No OpenAPI/Swagger is published. The SDK repos are generated from an internal swagger.json that is explicitly
      not committed (gofalcon Makefile).
  rest_registry:
    url: https://developer.crowdstrike.com/api-reference/all-operations/
    operations: 1463
    collections: 128
    gated: false
  graphql:
    endpoint: https://api.crowdstrike.com/identity-protection/combined/graphql/v1
    gated: true
    note: Identity Protection GraphQL. Anonymous introspection returns HTTP 401 (probed 2026-09-19); schema requires
      an authenticated OAuth2 token.
  mcp:
    product: falcon-mcp
    mode: local-stdio
    gated: true
    note: tools/list requires the operator's own Falcon credentials; tool metadata below came from the provider's
      per-module docs.
coverage:
  tools_documented: 166
  tools_bound: 69
  tools_unbound: 97
  rest_operations_total: 1463
  rest_operations_with_a_tool: 124
  note: 'A low bound-percentage is expected: falcon-mcp curates ~166 agent-facing tools over a 1,463-operation platform.'
  binding_rule: 'A candidate is recorded only when the operation carries one of the tool''s documented required
    scopes, shares >=2 name tokens with the tool, matches the tool verb''s HTTP-method class, and is not marked
    deprecated. Every binding is confidence: low by construction — nothing here is schema-verified, because CrowdStrike
    publishes no OpenAPI and both tools/list and GraphQL introspection are auth-gated.'
