specification: API Commons Packages
specificationVersion: '0.1'
provider: CrowdStrike
providerId: crowdstrike
generated: '2026-09-19'
method: searched
source: https://developer.crowdstrike.com/sdks/overview/
description: >-
  CrowdStrike publishes six official Falcon API SDKs (Python, PowerShell, Go, TypeScript/JavaScript,
  Rust, Ruby), a first-party MCP server, a Terraform provider, and the Foundry app-platform client
  libraries. Versions and publication dates below were read from each registry's metadata endpoint on
  2026-09-19; the Foundry CLI is distributed through a Homebrew tap and a Scoop bucket, neither of
  which exposes a queryable version endpoint, so its version is recorded as null.
packages:
  - language: python
    registry: pypi
    name: crowdstrike-falconpy
    url: https://pypi.org/project/crowdstrike-falconpy/
    install: pip install crowdstrike-falconpy
    repository: https://github.com/CrowdStrike/falconpy
    docs: https://developer.crowdstrike.com/sdks/python/
    official: true
    version: 1.6.5
    published: '2026-08-20'
    note: FalconPy — the reference SDK; Service Classes map one-to-one onto the API service collections.
  - language: powershell
    registry: powershellgallery
    name: PSFalcon
    url: https://www.powershellgallery.com/packages/PSFalcon
    install: Install-Module -Name PSFalcon -Scope CurrentUser
    repository: https://github.com/CrowdStrike/psfalcon
    docs: https://developer.crowdstrike.com/sdks/powershell/
    official: true
    version: 2.2.9
    published: '2025-09-13'
    note: >-
      Read from the PowerShell Gallery OData feed (FindPackagesById). Published date is a year older
      than every other first-party SDK in this list — the only decay signal in the CrowdStrike SDK
      estate.
  - language: go
    registry: go
    name: github.com/crowdstrike/gofalcon
    url: https://pkg.go.dev/github.com/crowdstrike/gofalcon
    install: go get github.com/crowdstrike/gofalcon
    repository: https://github.com/CrowdStrike/gofalcon
    docs: https://developer.crowdstrike.com/sdks/go/
    official: true
    version: v0.22.0
    published: '2026-08-04'
    note: >-
      Generated with go-swagger from an internal swagger.json that is NOT committed to the repo — the
      Makefile target says "swagger.json needs to be obtained manually at this moment". Only the
      transformation jq and the stripped-oauth pipeline are public.
  - language: javascript
    registry: npm
    name: crowdstrike-falcon
    url: https://www.npmjs.com/package/crowdstrike-falcon
    install: npm install crowdstrike-falcon
    repository: https://github.com/CrowdStrike/falconjs
    docs: https://developer.crowdstrike.com/sdks/typescript/
    official: true
    version: 0.7.0
    published: '2026-07-23'
    note: FalconJS — TypeScript-first client with automatic OAuth2 middleware; 120+ API services.
  - language: rust
    registry: crates.io
    name: rusty-falcon
    url: https://crates.io/crates/rusty-falcon
    install: cargo add rusty-falcon
    repository: https://github.com/CrowdStrike/rusty-falcon
    docs: https://developer.crowdstrike.com/sdks/rust/
    official: true
    version: 0.7.1
    published: '2026-05-19'
    note: >-
      README records the OpenAPI specification version it was generated from (2025-09-19T00:00:03Z);
      the spec itself is not published in the repo.
  - language: ruby
    registry: rubygems
    name: crimson-falcon
    url: https://rubygems.org/gems/crimson-falcon
    install: gem install crimson-falcon
    repository: https://github.com/CrowdStrike/crimson-falcon
    docs: https://developer.crowdstrike.com/sdks/ruby/
    official: true
    version: 1.4.0
    published: '2026-07-23'
    note: Generated by OpenAPI Generator; .openapi-generator/ config is public, the source spec is not.
  - language: python
    registry: pypi
    name: falcon-mcp
    url: https://pypi.org/project/falcon-mcp/
    install: uv tool install falcon-mcp
    repository: https://github.com/CrowdStrike/falcon-mcp
    docs: https://developer.crowdstrike.com/falcon-mcp/overview/
    official: true
    version: 0.19.0
    published: '2026-09-01'
    note: The self-hosted Falcon MCP server; see mcp/crowdstrike-mcp.yml.
  - language: hcl
    registry: terraform
    name: CrowdStrike/crowdstrike
    url: https://registry.terraform.io/providers/CrowdStrike/crowdstrike/latest
    install: 'terraform { required_providers { crowdstrike = { source = "CrowdStrike/crowdstrike" } } }'
    repository: https://github.com/CrowdStrike/terraform-provider-crowdstrike
    docs: https://developer.crowdstrike.com/cac/overview/
    official: true
    version: 0.0.87
    published: '2026-08-28'
    note: Backs the Configuration as Code documentation set.
  - language: javascript
    registry: npm
    name: "@crowdstrike/foundry-js"
    url: https://www.npmjs.com/package/@crowdstrike/foundry-js
    install: npm install @crowdstrike/foundry-js
    repository: https://github.com/CrowdStrike/foundry-js
    docs: https://developer.crowdstrike.com/foundry/understanding-foundry/
    official: true
    version: 0.22.0
    published: '2026-05-19'
    note: Bridge library used by Falcon Foundry UI extensions and pages.
  - language: javascript
    registry: npm
    name: "@crowdstrike/glide-core"
    url: https://www.npmjs.com/package/@crowdstrike/glide-core
    official: true
    version: 0.34.1
    published: '2025-09-09'
    note: CrowdStrike design-system web components. Published, but not referenced by the Foundry docs.
  - language: javascript
    registry: npm
    name: "@crowdstrike/falcon-shoelace"
    url: https://www.npmjs.com/package/@crowdstrike/falcon-shoelace
    official: true
    version: 0.4.0
    published: '2024-06-14'
    note: >-
      Falcon Shoelace theme the Foundry UI templates ship with. Last published 2024 — the oldest
      first-party package found for this provider.
  - language: python
    registry: pypi
    name: crowdstrike-foundry-function
    url: https://pypi.org/project/crowdstrike-foundry-function/
    install: pip install crowdstrike-foundry-function
    official: true
    version: 1.1.4
    published: '2026-02-24'
    note: Python runtime library for Falcon Foundry serverless functions.
  - language: go
    registry: cdn
    name: foundry
    url: https://developer.crowdstrike.com/foundry/getting-started/quickstart-cli/
    install: brew install crowdstrike/foundry-cli/foundry
    repository: https://github.com/CrowdStrike/foundry-cli
    official: true
    version: null
    published: null
    note: >-
      The Foundry CLI binary is distributed through a Homebrew tap (crowdstrike/foundry-cli), a Scoop
      bucket (crowdstrike/scoop-foundry-cli) and direct per-OS archive downloads. None of those has a
      queryable version metadata endpoint and the documented install commands are unpinned, so a
      consumer cannot tell which build they receive either. Checked 2026-09-19, nothing to record.
maintainers:
  - FN: Kin Lane
    email: kin@apievangelist.com
