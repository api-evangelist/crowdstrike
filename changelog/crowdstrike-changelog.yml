description: CrowdStrike publishes NO changelog for the Falcon platform API itself — /changelog/, /whats-new/ and
  /api-reference/changelog/ on the developer center all return the site's 404 shell, and release notes for the platform
  live behind the Falcon console (the /deployment-coordinator/ release-notes operations are themselves authenticated
  API calls). The one dated, public, machine-readable changelog CrowdStrike publishes for a developer product is
  the Falcon MCP server's, mirrored from the repo's release-please output. Recent window only.
scope: falcon-mcp server (developer product) — NOT the Falcon platform API
