description: PROVIDER-PUBLISHED Agent Skills, saved verbatim — nothing here is generated by API Evangelist. CrowdStrike
  ships an Anthropic-marketplace plugin, crowdstrike-falcon-foundry, whose eleven skills drive the full Falcon Foundry
  app lifecycle from an agent, plus a twelfth skill in the gofalcon SDK repo for regenerating the Go client. CrowdStrike
  documents the plugin on its own developer center at /foundry/getting-started/ai-skills/ and lists Claude Code
  as tested, with Codex, Copilot CLI, Cursor and Gemini CLI experimental.
