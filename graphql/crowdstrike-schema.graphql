  lastUpdated: DateTime
  malwareFamilies: [String]
  actors: [ThreatActor]
  killChains: [String]
  domainTypes: [String]
  ipAddressTypes: [String]
  tags: [String]
  reports: [String]
  vulnerabilities: [String]
