  status: AlertStatus
}

type KubernetesEvent {
  eventId: ID!
  clusterId: String
  clusterName: String
  namespace: String
  podName: String
  containerName: String
  eventType: String
  timestamp: DateTime
  severity: SeverityLevel
  message: String
