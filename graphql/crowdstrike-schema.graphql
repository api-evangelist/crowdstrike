  hostname: String
  createdAt: DateTime
  deletedAt: DateTime
  status: RTRSessionStatus
  userId: String
  userUuid: String
  offlineQueued: Boolean
  commands: [RTRCommand]
}

type RealtimeResponse {
  sessionId: ID!
  deviceId: String
  hostname: String
  status: RTRSessionStatus
  commands: [RTRCommand]
  createdAt: DateTime
}

