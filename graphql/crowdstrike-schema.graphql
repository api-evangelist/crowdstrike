}

# ─── CID / MSSP / Flight Control ─────────────────────────────────────────────

type CIDConfig {
  cid: ID!
  childCids: [String]
  parentCid: String
  name: String
  createdTimestamp: DateTime
  modifiedTimestamp: DateTime
  settings: JSON
}

type FlightControl {
  mssp: MSSP
  childCids: [CIDConfig]
  permissions: [String]
}

type MSSP {
  cid: ID!
  name: String
  childCids: [CIDConfig]
  managedDeviceCount: Int
  userRoles: [String]
  apiClients: [APIClient]
}

# ─── API / OAuth ──────────────────────────────────────────────────────────────

type OAuthToken {
  accessToken: String!
  tokenType: String
  expiresIn: Int
  issuedAt: DateTime
  expiresAt: DateTime
}

type APIClient {
  clientId: ID!
  name: String
  description: String
  cid: String
  createdAt: DateTime
  lastModified: DateTime
  clientSecret: String
  oauthToken: OAuthToken
  scopes: [String]
  enabled: Boolean
}

# ─── Root Operations ──────────────────────────────────────────────────────────

type Query {
  # Devices
  device(deviceId: ID!): Device
  devices(filter: String, limit: Int, offset: Int): [Device]
  deviceDetails(deviceId: ID!): DeviceDetails

  # Detections
  detection(detectionId: ID!): Detection
  detections(filter: String, limit: Int, offset: Int): [Detection]

  # Alerts
  alert(compositeId: ID!): Alert
  alerts(filter: String, limit: Int, offset: Int, sort: String): [Alert]

  # Incidents
  incident(incidentId: ID!): Incident
  incidents(filter: String, limit: Int, offset: Int): [Incident]

  # IOC
  ioc(id: ID!): IOC
  iocs(filter: String, limit: Int, offset: Int): [IOC]

  # Threat Intelligence
  threatIntelligence(indicatorId: ID!): ThreatIntelligence
  threatIndicators(query: String, type: IOCType, limit: Int): [ThreatIntelligence]
  threatActor(id: ID!): ThreatActor
  threatActors(query: String, limit: Int): [ThreatActor]

  # Vulnerabilities
  vulnerability(id: ID!): Vulnerability
  vulnerabilities(filter: String, limit: Int): [Vulnerability]
  spotlightVulnerabilities(filter: String, limit: Int): [SpotlightVulnerability]
  cve(cveId: ID!): CVE

  # Identity
  identity(userId: ID!): Identity
  identities(filter: String, limit: Int): [Identity]
  accountActivities(filter: String, limit: Int): [AccountActivity]

  # Policy
  policy(id: ID!): PolicyGroup
  policies(filter: String, limit: Int): [PolicyGroup]

  # Host Groups
  hostGroup(id: ID!): HostGroupFilter
  hostGroups(filter: String, limit: Int): [HostGroupFilter]

  # RTR
  rtrSession(sessionId: ID!): RTRSession
  rtrSessions(filter: String, limit: Int): [RTRSession]

  # Quarantine
  quarantine(id: ID!): Quarantine
  quarantines(filter: String, limit: Int): [Quarantine]

  # Samples / Sandbox
  sampleMetadata(sha256: ID!): SampleMetadata
  submission(id: ID!): Submission
  submissionResult(id: ID!): SubmissionResult
  falconX(reportId: ID!): FalconX

  # MalQuery
  malQuery(id: ID!): MalQuery
  malQuerySearch(query: String!, limit: Int): [MalQuery]

  # LogScale
  logScaleQuery(queryId: ID!): LogScale

  # Cloud Workloads
  cloudWorkload(instanceId: ID!): CloudWorkload
  cloudWorkloads(filter: String, limit: Int): [CloudWorkload]
  containerAlerts(filter: String, limit: Int): [ContainerAlert]
  kubernetesEvents(filter: String, limit: Int): [KubernetesEvent]

  # MSSP / Flight Control
  mssp(cid: ID!): MSSP
  flightControl: FlightControl
  cidConfig(cid: ID!): CIDConfig

  # API Clients
  apiClient(clientId: ID!): APIClient
  apiClients(limit: Int): [APIClient]

  # Sensor
  sensorUpdate(deviceId: ID!): SensorUpdate
}

type Mutation {
  # IOC management
  createIOC(
    type: IOCType!
    value: String!
    action: IOCAction!
    severity: SeverityLevel
    description: String
    platforms: [String]
    tags: [String]
    expiration: DateTime
  ): IOC

  updateIOC(id: ID!, action: IOCAction, severity: SeverityLevel, description: String): IOC
  deleteIOC(id: ID!): Boolean

  # Detection management
  updateDetection(detectionId: ID!, status: AlertStatus, assignedToUid: String): Detection

  # Alert management
  updateAlert(compositeId: ID!, status: AlertStatus, assignedToUid: String): Alert

  # Incident management
  createIncident(deviceIds: [ID!]!, name: String, description: String): Incident
  updateIncident(incidentId: ID!, status: IncidentStatus, assignedTo: String): Incident

  # RTR
  initRTRSession(deviceId: ID!, originId: String, queueOffline: Boolean): RTRSession
  executeRTRCommand(sessionId: ID!, command: String!, commandString: String!): RTRCommand
  deleteRTRSession(sessionId: ID!): Boolean

  # Quarantine
  updateQuarantine(ids: [ID!]!, action: String!): [Quarantine]

  # Sample submission
  submitSample(sha256: String!, filename: String, comment: String): SampleMetadata
  submitToSandbox(sha256: String!, filename: String, environmentId: Int): Submission

  # LogScale
  startLogScaleQuery(queryString: String!, start: DateTime, end: DateTime): LogScale

  # Policy
  createPolicy(name: String!, platformName: String!, description: String): PolicyGroup
  updatePolicy(id: ID!, enabled: Boolean, name: String, description: String): PolicyGroup
  deletePolicy(id: ID!): Boolean

  # Host Groups
  createHostGroup(name: String!, groupType: String!, assignmentRule: String): HostGroupFilter
  updateHostGroup(id: ID!, name: String, assignmentRule: String): HostGroupFilter
  deleteHostGroup(id: ID!): Boolean

  # Sensor tags
  addSensorTags(deviceIds: [ID!]!, tags: [String!]!): [SensorTag]
  deleteSensorTags(deviceIds: [ID!]!, tags: [String!]!): Boolean

  # API client management
  createAPIClient(name: String!, scopes: [String!]!, description: String): APIClient
  deleteAPIClient(clientId: ID!): Boolean
  refreshOAuthToken(clientId: ID!, clientSecret: String!): OAuthToken
}
