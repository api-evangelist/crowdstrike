"""
CrowdStrike Falcon Platform — Conceptual GraphQL Schema
Derived from the CrowdStrike OAuth2-based REST API surface.
Reference: https://falcon.crowdstrike.com/documentation/page/a2a7fc0e/crowdstrike-oauth2-based-apis
"""

scalar DateTime
scalar JSON

# ─── Enums ───────────────────────────────────────────────────────────────────

enum IOCType {
  SHA256
  MD5
  DOMAIN
  IPV4
  IPV6
}

enum IOCAction {
  NO_ACTION
  ALLOW
  PREVENT_NO_UI
  PREVENT
  DETECT
}

enum SeverityLevel {
  CRITICAL
  HIGH
  MEDIUM
  LOW
  INFORMATIONAL
}

enum AlertStatus {
  NEW
  IN_PROGRESS
  TRUE_POSITIVE
  FALSE_POSITIVE
  IGNORED
  CLOSED
}

enum IncidentStatus {
  NEW
  IN_PROGRESS
  CLOSED
  REOPENED
}

enum RTRSessionStatus {
  ACTIVE
  PENDING
  EXPIRED
  CLOSED
}

enum PolicyAction {
  PREVENT
  DETECT
  ALLOW
  MONITOR
}

enum SubmissionStatus {
  PENDING
  RUNNING
  SUCCESS
  FAILED
  SKIPPED
}

# ─── OS / Agent ──────────────────────────────────────────────────────────────

type OSDetails {
  platform: String
  version: String
  build: String
  kernelVersion: String
  productType: String
  majorVersion: String
  minorVersion: String
}

type AgentVersion {
  version: String
  build: String
  sensorVersion: String
  configBuild: String
  firstSeen: DateTime
  lastSeen: DateTime
}

type NetworkInterface {
  interfaceAlias: String
  interfaceDescription: String
  localIP: String
  macAddress: String
  networkPrefix: String
}

# ─── Device ──────────────────────────────────────────────────────────────────

type Device {
  deviceId: ID!
  hostname: String
  externalIP: String
  localIP: String
  macAddress: String
  osDetails: OSDetails
  agentVersion: AgentVersion
  networkInterfaces: [NetworkInterface]
  sensorTags: [SensorTag]
  groupIds: [String]
  status: String
  firstSeen: DateTime
  lastSeen: DateTime
  modifiedTimestamp: DateTime
  siteName: String
  systemManufacturer: String
  systemProductName: String
  productTypeDesc: String
  provisionStatus: String
  reducedFunctionalityMode: String
  containmentStatus: String
}

type DeviceDetails {
  device: Device
  policyDetails: [PolicyGroup]
  groupMemberships: [HostGroupFilter]
  vulnerabilities: [SpotlightVulnerability]
  detections: [Detection]
  incidents: [Incident]
  quarantinedFiles: [Quarantine]
}

# ─── Sensor ──────────────────────────────────────────────────────────────────

type SensorTag {
  tag: String!
  deviceId: String!
}

type SensorUpdate {
  deviceId: ID!
  policy: PolicyGroup
  scheduledUpdate: String
  pendingUpdate: Boolean
  currentVersion: String
  targetVersion: String
  uninstallProtectionEnabled: Boolean
}

# ─── IOC ─────────────────────────────────────────────────────────────────────

type IOC {
  id: ID!
  type: IOCType!
  value: String!
  action: IOCAction!
  severity: SeverityLevel
  description: String
  source: String
  tags: [String]
  platforms: [String]
  expiration: DateTime
  createdOn: DateTime
  createdBy: String
  modifiedOn: DateTime
  modifiedBy: String
  applied_globally: Boolean
}

# ─── Detection ───────────────────────────────────────────────────────────────

type DetectionBehavior {
  behaviorId: ID!
  detectionId: String
  timestamp: DateTime
  scenario: String
  objective: String
  tactic: String
  technique: String
  severity: Int
  confidence: Int
  iocType: IOCType
  iocValue: String
  iocSourceRuleId: String
  iocDescription: String
  commandLine: String
  parentProcessId: String
  processId: String
  fileName: String
  filePath: String
  sha256: String
  md5: String
  userPrincipalName: String
  userId: String
}

type DetectionDevice {
  deviceId: ID!
  hostname: String
  externalIP: String
  localIP: String
  platform: String
  osVersion: String
  agentVersion: String
  firstSeen: DateTime
  lastSeen: DateTime
}

type Detection {
  detectionId: ID!
  cid: String
  status: AlertStatus
  severity: Int
  severityName: SeverityLevel
  confidence: Int
  behaviors: [DetectionBehavior]
  device: DetectionDevice
  hostInfo: JSON
  maxSeverity: Int
  maxConfidence: Int
  firstBehavior: DateTime
  lastBehavior: DateTime
  createdTimestamp: DateTime
  overallRating: String
  emailSent: Boolean
  showInUi: Boolean
  assignedToName: String
  assignedToUid: String
}

# ─── Alert ───────────────────────────────────────────────────────────────────

type AlertBehavior {
  behaviorId: ID!
  alertId: String
  tactic: String
  technique: String
  description: String
  objective: String
  severity: Int
  confidence: Int
  iocValue: String
  iocType: IOCType
  timestamp: DateTime
}

type Alert {
  compositeId: ID!
  cid: String
  alertId: String
  status: AlertStatus
  severity: SeverityLevel
  confidenceScore: Int
  patternId: String
  patternName: String
  scenario: String
  behaviors: [AlertBehavior]
  device: DetectionDevice
  hostName: String
  localIP: String
  externalIP: String
  createdTime: DateTime
  updatedTime: DateTime
  assignedToName: String
  assignedToUid: String
  comments: [String]
  tags: [String]
}

# ─── Incident ─────────────────────────────────────────────────────────────────

type IncidentDevice {
  deviceId: ID!
  hostname: String
  platform: String
  agentVersion: String
}

type IncidentIndicator {
  type: IOCType
  value: String
  source: String
  timestamp: DateTime
}

type Incident {
  incidentId: ID!
  cid: String
  name: String
  description: String
  status: IncidentStatus
  severity: Int
  start: DateTime
  end: DateTime
  createdTime: DateTime
  modifiedTimestamp: DateTime
  assignedTo: String
  assignedToName: String
  hosts: [IncidentDevice]
  tactics: [String]
  techniques: [String]
  objectives: [String]
  users: [String]
  tags: [String]
  indicators: [IncidentIndicator]
  fineScore: Float
  state: String
}

# ─── Threat Intelligence ──────────────────────────────────────────────────────

type ThreatActor {
  id: ID!
  name: String
  slug: String
  shortDescription: String
  description: String
  origins: [String]
  targetCountries: [String]
  targetIndustries: [String]
  targetRegions: [String]
  motivations: [String]
  capabilities: [String]
  aliases: [String]
  firstActivityDate: DateTime
  lastActivityDate: DateTime
