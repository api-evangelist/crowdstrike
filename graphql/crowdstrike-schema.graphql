  cloudProvider: String
  accountId: String
  region: String
  resourceType: String
  resourceId: String
  imageName: String
  imageDigest: String
  status: String
  lastSeen: DateTime
  vulnerabilities: [SpotlightVulnerability]
  alerts: [ContainerAlert]
}

type ContainerAlert {
